<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizZzacC⚡️</title>

  <!-- Only fonts linked -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Anton&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #000000, #0a0a0a, #1b1b1b);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      overflow: hidden;
    }

    header {
      padding: 30px 0;
      background: #0d0d0d;
      box-shadow: 0 0 50px red;
      letter-spacing: 5px;
    }

    h1 {
      font-family: 'Anton', sans-serif;
      font-size: 3.5rem;
      color: #ff0000;
      text-shadow: 0 0 20px red, 0 0 40px darkred;
      animation: flicker 2s infinite;
    }

    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        opacity: 1;
      }
      20%, 24%, 55% {
        opacity: 0.2;
      }
    }

    .form-container {
      margin-top: 60px;
    }

    input {
      padding: 12px;
      margin: 10px;
      border: 2px solid red;
      font-size: 1rem;
      background-color: #000;
      color: #fff;
      border-radius: 5px;
    }

    button {
      background: #8b0000;
      color: white;
      font-size: 1rem;
      border: none;
      padding: 12px 25px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
      text-shadow: 0 0 10px black;
    }

    button:hover {
      background: #ff0000;
      box-shadow: 0 0 15px red;
      letter-spacing: 2px;
    }

    .hidden {
      display: none;
    }

    .countdown, .play-btn {
      margin-top: 30px;
      font-size: 1.5rem;
      text-shadow: 0 0 10px #ff0000;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    #playQuiz {
      background: #333;
      cursor: not-allowed;
      opacity: 0.5;
    }

    #playQuiz.enabled {
      background: #00ff00;
      color: black;
      font-weight: bold;
      cursor: pointer;
      animation: tremble 0.3s infinite;
    }

    @keyframes tremble {
      0% { transform: translateX(0px); }
      25% { transform: translateX(-2px); }
      50% { transform: translateX(2px); }
      75% { transform: translateX(-2px); }
      100% { transform: translateX(0px); }
    }

    h2 span {
      color: #ff3333;
      text-shadow: 0 0 5px red;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ QUIZZZACCC ⚡</h1>
  </header>

  <!-- Login/Register -->
  <div class="form-container" id="authForm">
    <input type="text" id="username" placeholder="Enter Your Name...">
    <button onclick="loginUser()">Enter The Dark Arena 🩸</button>
  </div>

  <!-- Quiz Interface (Hidden initially) -->
  <div id="quizInterface" class="hidden">
    <h2>Welcome, <span id="userDisplay"></span>...</h2>
    <div class="countdown" id="countdown">Quiz begins in: 00:00:10</div>
    <button id="playQuiz" disabled>☠️ You can't play yet...</button>
  </div>

  <script>
    let seconds = 10;

    function loginUser() {
      const name = document.getElementById('username').value.trim();
      if (name === "") return alert("Type your name to enter!");

      document.getElementById("authForm").classList.add("hidden");
      document.getElementById("quizInterface").classList.remove("hidden");
      document.getElementById("userDisplay").innerText = name;

      const timer = document.getElementById("countdown");
      const playBtn = document.getElementById("playQuiz");

      const interval = setInterval(() => {
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        timer.innerText = `Quiz begins in: 00:${m}:${s}`;
        seconds--;

        if (seconds < 0) {
          clearInterval(interval);
          playBtn.disabled = false;
          playBtn.classList.add("enabled");
          playBtn.innerText = "👹 Begin Quiz If You Dare!";
        }
      }, 1000);
    }
  </script>

</body>
</html>
